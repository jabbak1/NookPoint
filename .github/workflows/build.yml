name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache signing key
        uses: actions/cache@v4
        with:
          path: ~/.nookpoint.jks
          key: nookpoint-keystore-v1

      - name: Build
        run: |
          bash <<'NOOKBUILD'
          set -euo pipefail

          REPO="$(pwd)"

          # --- unpack a zip that was uploaded as-is
          if [ -z "$(find "$REPO" -name AndroidManifest.xml -not -path '*/.git/*' | head -n1)" ]; then
            mkdir -p "$REPO/unz"

            while IFS= read -r -d '' z; do
              echo "Unpacking: $z"
              unzip -o -q "$z" -d "$REPO/unz"
            done < <(
              find "$REPO" \
                -name '*.zip' \
                -not -path '*/.git/*' \
                -print0
            )
          fi

          # --- locate the project root
          ROOT=""

          while IFS= read -r -d '' m; do
            d="$(dirname "$m")"

            if [ -z "$ROOT" ]; then
              ROOT="$d"
            fi

            if [ -n "$(find "$d" -name T.java -print -quit)" ]; then
              ROOT="$d"
              break
            fi
          done < <(
            find "$REPO" \
              -name AndroidManifest.xml \
              -not -path '*/build/*' \
              -not -path '*/.git/*' \
              -print0
          )

          if [ -z "$ROOT" ]; then
            echo "AndroidManifest.xml not found. Repository contents:"
            find "$REPO" -not -path '*/.git/*' | head -100
            exit 1
          fi

          cd "$ROOT"

          echo "project root: $ROOT"

          # --- collect Java files safely, including paths with spaces
          mapfile -d '' JAVA_FILES < <(
            find . \
              -name '*.java' \
              -not -path './build/*' \
              -print0
          )

          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "No .java files found next to AndroidManifest.xml. Contents:"
            find . -not -path './.git/*' | head -100
            exit 1
          fi

          echo "Java files: ${#JAVA_FILES[@]}"

          # --- Android SDK tools
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK" ]; then
            echo "Android SDK not found at $SDK"
            exit 1
          fi

          BT=""

          while IFS= read -r d; do
            d="${d%/}"

            if [ -x "$d/d8" ] &&
               [ -x "$d/apksigner" ] &&
               [ -x "$d/zipalign" ]; then
              BT="$d"
              break
            fi
          done < <(
            ls -d "$SDK"/build-tools/*/ 2>/dev/null | sort -V -r
          )

          if [ -z "$BT" ]; then
            echo "No suitable build-tools"
            exit 1
          fi

          JAR=""

          while IFS= read -r d; do
            if [ -f "${d}android.jar" ]; then
              JAR="${d}android.jar"
              break
            fi
          done < <(
            ls -d "$SDK"/platforms/android-[0-9]*/ 2>/dev/null | sort -V -r
          )

          if [ -z "$JAR" ]; then
            echo "No android.jar"
            exit 1
          fi

          echo "build-tools: $BT"
          echo "android.jar: $JAR"

          # --- clean build directory
          rm -rf build
          mkdir -p build/classes
          mkdir -p build/dex

          # --- compile Java
          echo "== javac (${#JAVA_FILES[@]} files)"

          javac \
            -source 8 \
            -target 8 \
            -bootclasspath "$JAR" \
            -encoding UTF-8 \
            -Xlint:-options \
            -nowarn \
            -d build/classes \
            "${JAVA_FILES[@]}"

          # --- collect class files safely
          mapfile -d '' CLASS_FILES < <(
            find build/classes \
              -name '*.class' \
              -print0
          )

          if [ "${#CLASS_FILES[@]}" -eq 0 ]; then
            echo "No .class files produced by javac"
            exit 1
          fi

          # --- dex
          echo "== d8 (${#CLASS_FILES[@]} class files)"

          "$BT/d8" \
            --release \
            --min-api 7 \
            --lib "$JAR" \
            --output build/dex \
            "${CLASS_FILES[@]}"

          # --- resources
          echo "== resources"

          RES_ARGS=()
          if [ -d res ]; then
            RES_ARGS=(-S res)
          fi

          ASSET_ARGS=()
          if [ -d assets ]; then
            ASSET_ARGS=(-A assets)
          fi

          if [ -x "$BT/aapt" ]; then

            echo "Using aapt"

            "$BT/aapt" \
              package \
              -f \
              -0 ttf \
              -M AndroidManifest.xml \
              "${RES_ARGS[@]}" \
              "${ASSET_ARGS[@]}" \
              -I "$JAR" \
              -F build/app.unaligned

          else

            echo "Using aapt2"

            if [ -d res ]; then
              "$BT/aapt2" \
                compile \
                --dir res \
                -o build/res.zip
            else
              # Create an empty resource archive if there is no res directory
              mkdir -p build/empty-res
              "$BT/aapt2" \
                compile \
                --dir build/empty-res \
                -o build/res.zip
            fi

            "$BT/aapt2" \
              link \
              -o build/app.unaligned \
              -I "$JAR" \
              --manifest AndroidManifest.xml \
              --min-sdk-version 7 \
              --target-sdk-version 7 \
              "${ASSET_ARGS[@]}" \
              -0 .ttf \
              build/res.zip

          fi

          # --- add classes.dex
          if [ ! -f build/dex/classes.dex ]; then
            echo "classes.dex was not generated"
            find build/dex -maxdepth 2 -type f -print
            exit 1
          fi

          (
            cd build/dex
            zip -q -j ../app.unaligned classes.dex
          )

          # --- align + sign
          echo "== align + sign"

          "$BT/zipalign" \
            -f \
            4 \
            build/app.unaligned \
            build/app.aligned

          # --- signing key
          KS="${KS:-$HOME/.nookpoint.jks}"

          if [ ! -f "$KS" ]; then
            echo "Generating signing key..."

            keytool \
              -genkeypair \
              -keystore "$KS" \
              -storepass nookpoint \
              -keypass nookpoint \
              -alias nook \
              -keyalg RSA \
              -keysize 2048 \
              -validity 8000 \
              -dname "CN=NookPoint"
          fi

          # --- sign APK
          "$BT/apksigner" sign \
            --ks "$KS" \
            --ks-pass pass:nookpoint \
            --key-pass pass:nookpoint \
            --ks-key-alias nook \
            --min-sdk-version 7 \
            --v1-signing-enabled true \
            --v2-signing-enabled false \
            --v3-signing-enabled false \
            --out build/NookPoint.apk \
            build/app.aligned

          echo ""
          echo "========================================"
          echo "BUILD SUCCESSFUL"
          echo "========================================"
          echo "APK: $(pwd)/build/NookPoint.apk"
          echo "========================================"

          # --- expose APK path to GitHub Actions
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "APK=$(pwd)/build/NookPoint.apk" >> "$GITHUB_ENV"
          fi

          NOOKBUILD

      - uses: actions/upload-artifact@v4
        with:
          name: NookPoint-apk
          path: ${{ env.APK }}

name: Build APK
on:
  push:
  workflow_dispatch:
    inputs:
      show_key:
        description: "Print the signing key (base64) in the run summary, to save it as the KEYSTORE_B64 secret"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache signing key
        uses: actions/cache@v4
        with:
          path: ~/.nookpoint.jks
          key: nookpoint-keystore-v1
      - name: Use the permanent signing key from secrets (if present)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$HOME/.nookpoint.jks"
            echo "Using the signing key from the KEYSTORE_B64 secret"
          fi
      - name: Build
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          bash <<'NOOKBUILD'
          set -euo pipefail
          REPO="$(pwd)"

          # --- unpack a zip that was uploaded as-is
          if [ -z "$(find "$REPO" -name AndroidManifest.xml -not -path '*/.git/*' -print -quit)" ]; then
            while IFS= read -r -d '' z; do unzip -o -q "$z" -d "$REPO/unz"; done < <(find "$REPO" -name '*.zip' -not -path '*/.git/*' -print0)
          fi

          # --- locate the project root (folder names may contain spaces)
          ROOT=""
          while IFS= read -r -d '' m; do
            d="$(dirname "$m")"
            [ -n "$ROOT" ] || ROOT="$d"
            if [ -n "$(find "$d" -name T.java -print -quit)" ]; then ROOT="$d"; break; fi
          done < <(find "$REPO" -name AndroidManifest.xml -not -path '*/build/*' -not -path '*/.git/*' -print0)
          if [ -z "$ROOT" ]; then
            echo "AndroidManifest.xml not found. Repository contents:"
            find "$REPO" -not -path '*/.git/*' | head -100
            exit 1
          fi
          cd "$ROOT"
          echo "project root: $ROOT"
          [ -f AndroidManifest.xml ] || { echo "AndroidManifest.xml is not in $ROOT"; exit 1; }

          # --- Java files (prefer the src folder)
          SRC_DIR="."; [ -d src ] && SRC_DIR="src"
          JAVA_FILES=()
          while IFS= read -r -d '' f; do JAVA_FILES+=("$f"); done < <(find "$SRC_DIR" -name '*.java' -not -path './build/*' -print0)
          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "No .java files found in $ROOT. Contents:"
            find . -not -path './.git/*' | head -100
            exit 1
          fi

          # --- Android SDK tools
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$SDK" ] || { echo "Android SDK not found at $SDK"; exit 1; }
          BT=""
          for d in $(ls -d "$SDK"/build-tools/*/ | sort -V -r); do
            d="${d%/}"
            if [ -x "$d/d8" ] && [ -x "$d/apksigner" ] && [ -x "$d/zipalign" ]; then BT="$d"; break; fi
          done
          [ -n "$BT" ] || { echo "No suitable build-tools"; exit 1; }
          JAR=""
          for d in $(ls -d "$SDK"/platforms/android-[0-9]*/ | sort -V -r); do
            if [ -f "${d}android.jar" ]; then JAR="${d}android.jar"; break; fi
          done
          [ -n "$JAR" ] || { echo "No android.jar"; exit 1; }
          echo "build-tools: $BT"; echo "android.jar: $JAR"

          rm -rf build; mkdir -p build/classes build/dex

          echo "== javac (${#JAVA_FILES[@]} files)"
          javac -source 8 -target 8 -bootclasspath "$JAR" -encoding UTF-8 -Xlint:-options -nowarn -d build/classes "${JAVA_FILES[@]}"

          echo "== d8 (min API 7)"
          CLASSES=()
          while IFS= read -r -d '' f; do CLASSES+=("$f"); done < <(find build/classes -name '*.class' -print0)
          "$BT/d8" --release --min-api 7 --lib "$JAR" --output build/dex "${CLASSES[@]}"

          echo "== resources"
          RES=(); [ -d res ] && RES=(-S res)
          AST=(); [ -d assets ] && AST=(-A assets)
          if [ -x "$BT/aapt" ]; then
            "$BT/aapt" package -f -0 ttf -M AndroidManifest.xml "${RES[@]}" "${AST[@]}" -I "$JAR" -F build/app.unaligned
          else
            "$BT/aapt2" compile --dir res -o build/res.zip
            "$BT/aapt2" link -o build/app.unaligned -I "$JAR" --manifest AndroidManifest.xml \
              --min-sdk-version 7 --target-sdk-version 7 "${AST[@]}" -0 .ttf build/res.zip
          fi
          (cd build/dex && zip -q -j ../app.unaligned classes.dex)

          echo "== align + sign"
          "$BT/zipalign" -f 4 build/app.unaligned build/app.aligned
          KS="${KS:-$HOME/.nookpoint.jks}"
          KS_PASS="${KS_PASS:-nookpoint}"
          if [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$KS_PASS" -alias nook \
              -keyalg RSA -keysize 2048 -validity 8000 -dname "CN=NookPoint"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --ks-key-alias nook --min-sdk-version 7 \
            --v1-signing-enabled true --v2-signing-enabled false --v3-signing-enabled false \
            --out build/NookPoint.apk build/app.aligned
          echo "Done: $(pwd)/build/NookPoint.apk"
          VERSION_NAME="$(grep -o 'versionName="[^"]*"' AndroidManifest.xml | head -n1 | cut -d'"' -f2)"
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "APK=$(pwd)/build/NookPoint.apk" >> "$GITHUB_ENV"
            echo "VERSION=${VERSION_NAME:-0}" >> "$GITHUB_ENV"
          fi
          NOOKBUILD
      - name: Show signing key (only when asked)
        if: ${{ github.event.inputs.show_key == 'true' }}
        run: |
          {
            echo "### Signing key"
            echo "Save this text as the repository secret KEYSTORE_B64 (Settings > Secrets and variables > Actions)."
            echo "If you did not set KEYSTORE_PASS, the key password is: nookpoint (leave KEYSTORE_PASS unset)."
            echo '```'
            base64 -w0 "$HOME/.nookpoint.jks"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare release files and notes
        run: |
          set -euo pipefail
          ROOT="$(dirname "$(dirname "$APK")")"
          NAMED="$ROOT/build/NookPoint-$VERSION.apk"
          cp "$APK" "$NAMED"
          SHA="$(sha256sum "$NAMED" | cut -d' ' -f1)"
          echo "$SHA  NookPoint-$VERSION.apk" > "$NAMED.sha256"
          if [ -f "$ROOT/docs/release-header.md" ]; then
            sed -e "s/@VERSION@/$VERSION/g" -e "s/@SHA256@/$SHA/g" "$ROOT/docs/release-header.md" > release-notes.md
            [ -f "$ROOT/docs/features.md" ] && cat "$ROOT/docs/features.md" >> release-notes.md
            echo >> release-notes.md
            if [ -f "$ROOT/CHANGELOG.md" ]; then
              awk -v v="$VERSION" '/^## \[/ { if (index($0, "[" v "]") > 0) p = 1; else if (p) exit } p' "$ROOT/CHANGELOG.md" >> release-notes.md
            fi
          else
            printf '# NookPoint %s\n\nSHA-256: `%s`\n' "$VERSION" "$SHA" > release-notes.md
          fi
          echo "NAMED_APK=$NAMED" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: NookPoint-apk
          path: ${{ env.NAMED_APK }}
      - name: Publish a release with notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: NookPoint ${{ env.VERSION }}
          body_path: release-notes.md
          make_latest: true
          files: |
            ${{ env.NAMED_APK }}
            ${{ env.NAMED_APK }}.sha256
